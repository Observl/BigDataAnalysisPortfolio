<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global EV Market Analysis｜ObservL 作品集</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(12px, 2.6vw, 36px);
      background: #ffffff;
    }
    main { width: min(1440px, 100%); }
    .project-banner {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: #f6f2ff;
      box-shadow: 0 18px 45px rgba(91, 33, 182, .11);
    }
    .project-banner::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.02) 44%, rgba(255,255,255,.18) 100%);
    }
    .project-banner img {
      display: block;
      width: 100%;
      height: clamp(230px, 35vw, 500px);
      object-fit: cover;
      object-position: center;
    }
    @media (max-width: 560px) {
      body { padding: 12px; }
      .project-banner { border-radius: 16px; }
      .project-banner img { height: 240px; }
    }
  </style>
  <link rel="stylesheet" href="../assets/project-outline.css">
</head>
<body>
  <main>
    <a class="home-return" href="../index.html" role="button">← 返回主页</a>
    <div class="project-banner">
      <img src="../assets/banners/global-ev-market.png" alt="全球电动汽车市场分析项目横幅：地图、充电网络与跨区域数据连接的抽象视觉">
    </div>
  </main>
</body>
</html>
