<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ObservL 的数据分析作品集，展示淘宝用户购物行为、新能源汽车经营和巴西电商分析。">
  <meta name="theme-color" content="#111313">
  <title>ObservL · 数据分析作品集</title>
  <link rel="stylesheet" href="./assets/home.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="scroll-progress" aria-hidden="true"></div>
  <header class="hero" id="top">
    <div class="hero-inner frame">
      <nav class="site-nav" aria-label="主导航">
        <a class="site-brand" href="#top">ObservL</a>
        <div class="site-nav-links">
          <a href="#projects">项目</a>
          <a href="https://github.com/Observl/BigDataAnalysisPortfolio" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
      </nav>
      <div class="hero-main">
        <p class="hero-label">数据分析作品集</p>
        <h1 class="hero-name">ObservL</h1>
        <div class="hero-thumbnails" aria-hidden="true">
          <img src="./assets/portfolio/taobao-shopping-journey.jpg" width="1672" height="941" alt="">
          <img src="./assets/portfolio/nev-market.jpg" width="1916" height="821" alt="">
          <img src="./assets/portfolio/brazil-commerce-v2.jpg" width="1672" height="941" alt="">
        </div>
        <div class="hero-bottom">
          <p>从行为、市场与履约中寻找线索。</p>
          <a class="jump-link" href="#projects">查看项目 <span aria-hidden="true">↓</span></a>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="work" id="projects" aria-labelledby="projects-title">
      <div class="frame">
        <div class="work-heading reveal">
          <h2 id="projects-title">项目</h2>
          <p>三个独立数据分析项目</p>
        </div>
        <div class="project-list">
          <article class="project project--taobao">
            <a class="project-link" href="./taobao/index.html?view=charts" aria-label="查看淘宝用户购物行为分析图表报告">
              <div class="project-media reveal"><img src="./assets/portfolio/taobao-shopping-journey.jpg" width="1672" height="941" loading="lazy" decoding="async" alt="用户在多种商品中使用手机浏览与选择的主题摄影"></div>
              <div class="project-copy reveal">
                <h3 class="project-title">淘宝用户<br>购物行为分析</h3>
                <span class="project-open">查看报告 <span aria-hidden="true">↗</span></span>
              </div>
            </a>
          </article>

          <article class="project project--nev">
            <a class="project-link" href="./nev/index.html?view=charts" aria-label="查看新能源汽车经营分析图表报告">
              <div class="project-media reveal"><img src="./assets/portfolio/nev-market.jpg" width="1916" height="821" loading="lazy" decoding="async" alt="夜间成排新能源汽车及充电设施的主题摄影"></div>
              <div class="project-copy reveal">
                <h3 class="project-title">新能源汽车<br>经营分析</h3>
                <span class="project-open">查看报告 <span aria-hidden="true">↗</span></span>
              </div>
            </a>
          </article>

          <article class="project project--brazil">
            <a class="project-link" href="./brazil/index.html?view=charts" aria-label="查看巴西电商分析图表报告">
              <div class="project-media reveal"><img src="./assets/portfolio/brazil-commerce-v2.jpg" width="1672" height="941" loading="lazy" decoding="async" alt="巴西店铺的葡语在线购物界面、包裹和配送场景"></div>
              <div class="project-copy reveal">
                <h3 class="project-title">巴西电商分析</h3>
                <span class="project-open">查看报告 <span aria-hidden="true">↗</span></span>
              </div>
            </a>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="frame footer-top">
      <p>感谢浏览。<br>项目细节都在报告里。</p>
      <div class="footer-links"><a href="https://github.com/Observl/BigDataAnalysisPortfolio" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
    </div>
    <div class="frame">
      <div class="footer-bottom">
        <p class="footer-name">ObservL</p>
        <img class="avatar" src="./assets/observl-avatar.png" width="1024" height="1024" loading="lazy" decoding="async" alt="ObservL 的头像">
      </div>
      <div class="footnote"><span>ObservL · 数据分析作品集</span><span>© 2026</span></div>
    </div>
  </footer>
  <script src="./assets/home-motion.js" defer></script>
</body>
</html>
